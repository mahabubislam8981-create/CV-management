<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CV Create</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="cv-container">

        <div class="cv-page">

            <!-- CV PAD -->
            <img
                src="../assets/cv-pad.jpg"
                class="pad-background"
                alt="CV Pad"
            >


            <!-- PHOTO -->
            <div class="photo-area">

                <img src="" alt="Profile Photo">

                <div class="photo-placeholder">
                    ছবি যোগ করুন
                </div>

                <input
                    type="file"
                    class="photo-input"
                    accept="image/*"
                >

            </div>


            <!-- =========================
                 PERSONAL INFORMATION
            ========================== -->

            <input
                type="text"
                class="cv-field"
                data-field="name"
                placeholder="নাম"
            >

            <input
                type="text"
                class="cv-field"
                data-field="father"
                placeholder="পিতার নাম"
            >

            <input
                type="text"
                class="cv-field"
                data-field="mother"
                placeholder="মাতার নাম"
            >

            <input
                type="text"
                class="cv-field"
                data-field="dateOfBirth"
                placeholder="জন্ম তারিখ"
            >

            <input
                type="text"
                class="cv-field"
                data-field="nationality"
                placeholder="জাতীয়তা"
            >

            <input
                type="text"
                class="cv-field"
                data-field="religion"
                placeholder="ধর্ম"
            >

            <input
                type="text"
                class="cv-field"
                data-field="maritalStatus"
                placeholder="বৈবাহিক অবস্থা"
            >

            <input
                type="text"
                class="cv-field"
                data-field="phone"
                placeholder="মোবাইল নম্বর"
            >

            <input
                type="text"
                class="cv-field"
                data-field="email"
                placeholder="ই-মেইল"
            >

            <textarea
                class="cv-field"
                data-field="address"
                placeholder="ঠিকানা"
            ></textarea>

        </div>

    </div>


    <!-- =========================
         BUTTONS
    ========================== -->

    <div class="action-area">

        <button
            type="button"
            class="action-btn print-btn">
            Print
        </button>

        <button
            type="button"
            class="action-btn clear-btn">
            Clear
        </button>

    </div>


    <script type="module" src="../js/app.js"></script>

</body>
</html>
